<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبارات ومراجعة — تعلم الروسية بالعربي</title>
<script>
  (function(){
    var t = localStorage.getItem("ru_arabi_theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page-head{ padding:28px 0 8px; text-align:center; }
  .page-head h1{ font-size:2rem; color:var(--gold-soft); margin-bottom:8px; }
  .page-head p{ color:var(--text-dim2); font-size:.95rem; }

  .start-card{
    margin-top:24px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:24px 20px; text-align:center;
  }
  .start-card .big{ font-size:2.2rem; margin-bottom:10px; }
  .start-card p{ font-size:.88rem; color:var(--text-dim2); margin-bottom:6px; }
  .start-card .mix{ font-size:.78rem; color:var(--text-dim4); margin-bottom:18px; }

  .best-score{
    display:flex; justify-content:center; gap:18px; margin:20px 0;
  }
  .best-score .item{ text-align:center; }
  .best-score .num{ font-family:'Aref Ruqaa', serif; font-size:1.4rem; color:var(--gold-soft); }
  .best-score .lbl{ font-size:.72rem; color:var(--text-dim4); }

  /* ---- quiz runner ---- */
  .quiz{ display:none; }
  .quiz.open{ display:block; }
  .quiz-top{ display:flex; align-items:center; gap:12px; padding:16px 0; }
  .quiz-bar{ flex:1; height:6px; background:var(--surface); border-radius:3px; overflow:hidden; }
  .quiz-bar-fill{ height:100%; background:var(--gold); width:0%; transition:width .3s ease; }
  .quiz-count{ font-size:.8rem; color:var(--text-dim3); }

  .q-tag{
    display:inline-block; font-size:.7rem; color:var(--gold-soft);
    background:var(--surface2); border:1px solid var(--border);
    padding:3px 10px; border-radius:12px; margin-bottom:12px;
  }
  .q-text{ font-size:1.15rem; color:var(--text); margin-bottom:6px; }
  .q-sub{ font-family:'Aref Ruqaa', serif; font-size:1.8rem; color:var(--gold-soft); margin-bottom:20px; }

  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choice-btn{
    text-align:right; font-family:'Tajawal',sans-serif; font-size:.95rem;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    padding:14px 16px; border-radius:10px; cursor:pointer;
  }
  .choice-btn.correct{ border-color:var(--green); background:rgba(63,122,87,.15); }
  .choice-btn.wrong{ border-color:var(--brick); background:rgba(139,53,48,.15); }
  .choice-btn:disabled{ cursor:default; }

  .next-row{ margin-top:20px; text-align:left; }

  .result-box{ text-align:center; padding:20px 0; }
  .result-box .big{ font-size:2.4rem; margin-bottom:10px; }
  .result-box .pct{ font-family:'Aref Ruqaa', serif; font-size:2rem; color:var(--gold-soft); margin-bottom:6px; }
  .result-box p{ font-size:.9rem; color:var(--text-dim2); margin-bottom:20px; }
  .result-actions{ display:flex; gap:10px; justify-content:center; }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:var(--on-accent); font-weight:800;
    padding:10px 22px; border-radius:20px; font-size:.9rem;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }
</style>
</head>
<body>
<div class="stars"></div>

<div class="app-header">
  <a class="icon-circle" href="index.html" aria-label="الرئيسية">←</a>
  <div class="stats" id="statsBar"></div>
  <button class="theme-toggle" id="themeToggleBtn" onclick="ruToggleTheme()" aria-label="تبديل الوضع الليلي">🌙</button>
</div>

<div class="wrap has-bottom-nav">
  <div class="page-head">
    <h1>اختبارات ومراجعة</h1>
    <p>اختبار مختلط بيجمع سؤال من الحروف والمفردات والعبارات</p>
  </div>

  <div class="start-card" id="startCard">
    <div class="big">📝</div>
    <p>١٥ سؤال متنوع، اختيار من متعدد</p>
    <div class="mix">حروف سيريلية + مفردات + عبارات — بترتيب عشوائي كل مرة</div>

    <div class="best-score" id="bestScore"></div>

    <button class="cta" onclick="startQuiz()">ابدأ الاختبار</button>
  </div>

  <div class="quiz" id="quiz">
    <div class="quiz-top">
      <span class="quiz-count" id="quizCount">1/15</span>
      <div class="quiz-bar"><div class="quiz-bar-fill" id="quizBarFill"></div></div>
    </div>
    <div id="quizBody"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="tab-icon">🏠</span><span>الرئيسية</span></a>
  <a href="letters.html"><span class="tab-icon">🔤</span><span>الحروف</span></a>
  <a href="vocabulary.html"><span class="tab-icon">📚</span><span>المفردات</span></a>
  <a class="disabled" href="#"><span class="tab-icon">🏅</span><span>إنجازاتي</span><span class="dot"></span></a>
</nav>

<div class="toast" id="toast"></div>

<script src="progress.js"></script>
<script src="theme.js"></script>
<script src="audio.js"></script>
<script src="vocab.js"></script>
<script>
ruRenderStatsBar("statsBar");

function ruSpeak(text){ ruPlayAudio(text); }

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---- بنك أسئلة الحروف ---- */
const LETTER_BANK = [
  { letter:"В", correct:"ف / v", options:["ب / b","ف / v","هـ / h","ن / n"] },
  { letter:"Н", correct:"ن / n", options:["هـ / h","م / m","ن / n","پ / p"] },
  { letter:"Р", correct:"ر / r", options:["پ / p","ر / r","ب / b","و / w"] },
  { letter:"С", correct:"س / s", options:["ك / k","س / s","ش / sh","ص / s"] },
  { letter:"У", correct:"و / u", options:["ي / y","أ / a","و / u","إ / e"] },
  { letter:"Х", correct:"خ / kh", options:["كس / x","خ / kh","ه / h","ز / z"] },
  { letter:"Ж", correct:"صوت بين الج والز", options:["ج عادية","صوت بين الج والز","ز عادية","ش عادية"] },
  { letter:"Ц", correct:"تس", options:["تش","تس","دز","سك"] }
];

/* ---- بنك أسئلة العبارات ---- */
const PHRASE_BANK = [
  { q:"عايز تسأل 'بكام ده؟'", correct:"Сколько это стоит?", options:["Где вокзал?","Сколько это стоит?","Как дела?","До завтра"] },
  { q:"عايز تقول 'شكراً'", correct:"Спасибо", options:["Пожалуйста","Извините","Спасибо","Привет"] },
  { q:"عايز تسأل 'فين الحمام؟'", correct:"Где туалет?", options:["Где туалет?","Сколько это стоит?","Я не понимаю","До завтра"] },
  { q:"عايز تقول 'أنا مش فاهم'", correct:"Я не понимаю", options:["Я студент","Я не понимаю","Приятно познакомиться","Мне нужна помощь"] }
];

function buildVocabQuestions(count){
  const words = shuffle(ruAllVocabWords()).slice(0, count);
  return words.map(w => {
    const wrongPool = shuffle(ruAllVocabWords().filter(x => x.id !== w.id)).slice(0,3).map(x => x.ar);
    return {
      type:"vocab", q: w.ru, tr: w.tr, correct: w.ar,
      options: shuffle([w.ar, ...wrongPool])
    };
  });
}

function buildLetterQuestions(count){
  return shuffle(LETTER_BANK).slice(0, count).map(l => ({
    type:"letter", q:"إيه صوت الحرف ده؟", sub:l.letter, correct:l.correct,
    options: shuffle(l.options)
  }));
}

function buildPhraseQuestions(count){
  return shuffle(PHRASE_BANK).slice(0, count).map(p => ({
    type:"phrase", q:p.q, correct:p.correct,
    options: shuffle(p.options)
  }));
}

let quizQuestions = [];
let quizIdx = 0;
let quizScore = 0;

function startQuiz(){
  quizQuestions = shuffle([
    ...buildLetterQuestions(5),
    ...buildVocabQuestions(6),
    ...buildPhraseQuestions(4)
  ]);
  quizIdx = 0;
  quizScore = 0;
  document.getElementById("startCard").style.display = "none";
  document.getElementById("quiz").classList.add("open");
  renderQuestion();
}

function renderQuestion(){
  const total = quizQuestions.length;
  document.getElementById("quizCount").textContent = (quizIdx+1) + "/" + total;
  document.getElementById("quizBarFill").style.width = Math.round((quizIdx/total)*100) + "%";

  if (quizIdx >= total) { renderResult(); return; }
  const q = quizQuestions[quizIdx];
  const tagMap = { letter:"حروف", vocab:"مفردات", phrase:"عبارات" };

  let subHtml = "";
  if (q.type === "letter") subHtml = `<div class="q-sub">${q.sub}</div>`;
  if (q.type === "vocab") subHtml = `<div class="q-sub">${q.q} <span style="font-size:1rem; color:var(--text-dim4);">(${q.tr})</span></div>`;

  document.getElementById("quizBody").innerHTML = `
    <span class="q-tag">${tagMap[q.type]}</span>
    <div class="q-text">${q.type === "phrase" ? q.q : (q.type === "letter" ? q.q : "إيه معنى الكلمة دي؟")}</div>
    ${subHtml}
    <div class="choices" id="choices"></div>
  `;

  const choicesEl = document.getElementById("choices");
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(opt, q, btn);
    choicesEl.appendChild(btn);
  });
}

function selectAnswer(chosen, q, btn){
  const allBtns = document.querySelectorAll("#choices .choice-btn");
  allBtns.forEach(b => b.disabled = true);

  if (chosen === q.correct) {
    btn.classList.add("correct");
    quizScore++;
  } else {
    btn.classList.add("wrong");
    allBtns.forEach(b => { if (b.textContent === q.correct) b.classList.add("correct"); });
  }
  if (q.type === "letter" || q.type === "vocab") ruSpeak(q.type === "vocab" ? q.q : "");

  const body = document.getElementById("quizBody");
  const nextRow = document.createElement("div");
  nextRow.className = "next-row";
  nextRow.innerHTML = `<button class="cta" onclick="nextQuestion()">${quizIdx+1 >= quizQuestions.length ? 'شوف النتيجة' : 'التالي ←'}</button>`;
  body.appendChild(nextRow);
}

function nextQuestion(){
  quizIdx++;
  renderQuestion();
}

function renderResult(){
  const total = quizQuestions.length;
  const pct = Math.round((quizScore/total)*100);
  document.getElementById("quizBarFill").style.width = "100%";

  const already = RuProgress.getState().sections.quizzes;
  RuProgress.markSectionComplete("quizzes");
  const xp = quizScore * 4;
  RuProgress.addXp(xp, "quiz_completed");
  ruRenderStatsBar("statsBar");

  const state = RuProgress.getState();
  const prevBest = state.sections.quizBest || 0;
  if (pct > prevBest) {
    state.sections.quizBest = pct;
    RuProgress.markSectionComplete("quizzes"); // ensures save path touched
    localStorage.setItem("ru_arabi_progress_v1", JSON.stringify(state));
  }

  let emoji = "🙂";
  if (pct >= 90) emoji = "🏆";
  else if (pct >= 70) emoji = "🎉";
  else if (pct < 40) emoji = "💪";

  document.getElementById("quizBody").innerHTML = `
    <div class="result-box">
      <div class="big">${emoji}</div>
      <div class="pct">${pct}%</div>
      <p>جاوبت صح على ${quizScore} من ${total} — كسبت ${xp} XP</p>
      <div class="result-actions">
        <button class="cta" onclick="startQuiz()">جرب تاني</button>
        <a class="btn-ghost" href="index.html" style="text-decoration:none;">الرئيسية</a>
      </div>
    </div>
  `;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---- أفضل نتيجة سابقة ---- */
(function(){
  const state = RuProgress.getState();
  const best = (state.sections && state.sections.quizBest) || 0;
  document.getElementById("bestScore").innerHTML = best > 0
    ? `<div class="item"><div class="num">${best}%</div><div class="lbl">أفضل نتيجة</div></div>`
    : "";
})();
</script>
</body>
</html>
