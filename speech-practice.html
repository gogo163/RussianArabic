<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدريب النطق — تعلم الروسية بالعربي</title>
<script>
  (function(){
    var t = localStorage.getItem("ru_arabi_theme");
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page-head{ padding:28px 0 8px; text-align:center; }
  .page-head h1{ font-size:2rem; color:var(--gold-soft); margin-bottom:8px; }
  .page-head p{ color:var(--text-dim2); font-size:.95rem; }

  .support-warning{
    margin-top:16px; background:rgba(166,69,63,.12); border:1px solid rgba(166,69,63,.4);
    border-radius:8px; padding:12px 16px; font-size:.85rem; color:var(--brick); display:none;
  }
  .support-warning.show{ display:block; }

  .practice-card{
    margin-top:26px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:30px 20px; text-align:center;
  }
  .target-ru{ font-family:'Aref Ruqaa', serif; font-size:2.4rem; color:var(--text); margin-bottom:6px; }
  .target-tr{ font-size:.9rem; color:var(--text-dim4); margin-bottom:4px; }
  .target-ar{ font-size:1rem; color:var(--text-dim2); margin-bottom:24px; }

  .listen-btn{
    background:none; border:none; color:var(--ice); font-size:.85rem; cursor:pointer;
    margin-bottom:20px;
  }

  .mic-btn{
    width:96px; height:96px; border-radius:50%;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));
    border:none; font-size:2.2rem; cursor:pointer;
    box-shadow:0 8px 24px rgba(212,169,79,.3);
    color:var(--on-accent);
  }
  .mic-btn.listening{ animation: ruPulse 1s infinite; background:linear-gradient(135deg, var(--brick), #c0554d); }
  @keyframes ruPulse{
    0%{ box-shadow:0 0 0 0 rgba(212,169,79,.5); }
    70%{ box-shadow:0 0 0 22px rgba(212,169,79,0); }
    100%{ box-shadow:0 0 0 0 rgba(212,169,79,0); }
  }
  .mic-hint{ font-size:.8rem; color:var(--text-dim4); margin-top:12px; }

  .result-box{ display:none; margin-top:24px; }
  .result-box.shown{ display:block; }

  .playback-row{ display:flex; justify-content:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .playback-btn{
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 16px; font-size:.85rem; cursor:pointer;
  }

  .rate-heading{ font-size:.88rem; color:var(--text-dim2); margin-bottom:12px; }
  .rate-row{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .rate-btn{
    border:1px solid var(--border); background:var(--surface2); color:var(--text);
    border-radius:10px; padding:10px 14px; font-size:.85rem; cursor:pointer;
  }
  .rate-btn.excellent{ border-color:var(--green); color:var(--green); }
  .rate-btn.close{ border-color:var(--gold-soft); color:var(--gold-soft); }
  .rate-btn.retry{ border-color:var(--brick); color:var(--brick); }

  .verdict{ font-size:1rem; font-weight:800; text-align:center; margin:16px 0 4px; display:none; }
  .verdict.shown{ display:block; }
  .verdict.excellent{ color:var(--green); }
  .verdict.close{ color:var(--gold-soft); }
  .verdict.retry{ color:var(--brick); }

  .action-row{ display:flex; gap:10px; justify-content:center; margin-top:14px; }

  .error-box{ display:none; margin-top:18px; color:var(--brick); font-size:.88rem; text-align:center; }
  .error-box.shown{ display:block; }

  .stats-row{ display:flex; justify-content:center; gap:20px; margin-top:22px; }
  .stats-row .item{ text-align:center; }
  .stats-row .num{ font-family:'Aref Ruqaa', serif; font-size:1.3rem; color:var(--gold-soft); }
  .stats-row .lbl{ font-size:.7rem; color:var(--text-dim4); }
</style>
</head>
<body>
<div class="stars"></div>

<div class="app-header">
  <a class="icon-circle" href="index.html" aria-label="الرئيسية">←</a>
  <div class="stats" id="statsBar"></div>
  <button class="theme-toggle" id="themeToggleBtn" onclick="ruToggleTheme()" aria-label="تبديل الوضع الليلي">🌙</button>
</div>

<div class="wrap has-bottom-nav">
  <div class="page-head">
    <h1>تدريب النطق 🎤</h1>
    <p>اسمع الكلمة، قولها بصوتك، اسمع نفسك، وقيّم نطقك بنفسك</p>
  </div>

  <div class="support-warning" id="supportWarning">
    ⚠️ الجهاز/المتصفح ده مش بيدعم تسجيل الصوت.
  </div>

  <div class="practice-card">
    <div class="target-ru" id="targetRu">—</div>
    <div class="target-tr" id="targetTr"></div>
    <div class="target-ar" id="targetAr"></div>

    <button class="listen-btn" onclick="playTarget()">🔊 اسمع النطق الصح الأول</button>

    <div>
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
      <div class="mic-hint" id="micHint">دوس وقول الكلمة، ودوس تاني عشان توقف التسجيل</div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="result-box" id="resultBox">
      <div class="playback-row">
        <button class="playback-btn" onclick="playRecording()">▶️ اسمع تسجيلك</button>
        <button class="playback-btn" onclick="playTarget()">🔊 اسمع النطق الصحيح</button>
      </div>

      <div class="rate-heading">إيه رأيك في نطقك؟</div>
      <div class="rate-row">
        <button class="rate-btn excellent" onclick="rate('excellent')">🎉 ممتاز</button>
        <button class="rate-btn close" onclick="rate('close')">👍 قريب</button>
        <button class="rate-btn retry" onclick="rate('retry')">🔁 محتاج تمرين</button>
      </div>

      <div class="verdict" id="verdictText"></div>

      <div class="action-row">
        <button class="cta" onclick="nextWord()">الكلمة الجاية ←</button>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="item"><div class="num" id="attemptsNum">0</div><div class="lbl">محاولات</div></div>
    <div class="item"><div class="num" id="avgNum">0%</div><div class="lbl">متوسط التقييم</div></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html"><span class="tab-icon">🏠</span><span>الرئيسية</span></a>
  <a href="letters.html"><span class="tab-icon">🔤</span><span>الحروف</span></a>
  <a href="vocabulary.html"><span class="tab-icon">📚</span><span>المفردات</span></a>
  <a class="disabled" href="#"><span class="tab-icon">🏅</span><span>إنجازاتي</span><span class="dot"></span></a>
</nav>

<audio id="recPlayer" style="display:none"></audio>

<script src="progress.js"></script>
<script src="theme.js"></script>
<script src="audio.js"></script>
<script src="vocab.js"></script>
<script src="speech-check.js"></script>
<script>
ruRenderStatsBar("statsBar");

if (!ruMicSupported()) {
  document.getElementById("supportWarning").classList.add("show");
  document.getElementById("micBtn").disabled = true;
}

let pool = [];
let current = null;
let attempts = 0;
let scoreSum = 0;

let isRecording = false;
let stopRecordingFn = null;
let lastRecordingUrl = null;

function loadPool(){
  pool = [...ruAllVocabWords()].sort(() => Math.random()-0.5);
}

function nextWord(){
  document.getElementById("resultBox").classList.remove("shown");
  document.getElementById("errorBox").classList.remove("shown");
  document.getElementById("verdictText").classList.remove("shown");
  if (pool.length === 0) loadPool();
  current = pool.pop();
  document.getElementById("targetRu").textContent = current.ru;
  document.getElementById("targetTr").textContent = current.tr;
  document.getElementById("targetAr").textContent = current.ar;
}

function playTarget(){
  if (current) ruPlayAudio(current.ru);
}

function playRecording(){
  if (!lastRecordingUrl) return;
  const player = document.getElementById("recPlayer");
  player.src = lastRecordingUrl;
  player.play();
}

function toggleRecording(){
  const micBtn = document.getElementById("micBtn");
  const hint = document.getElementById("micHint");
  document.getElementById("errorBox").classList.remove("shown");

  if (!isRecording){
    // ابدأ تسجيل جديد
    document.getElementById("resultBox").classList.remove("shown");
    document.getElementById("verdictText").classList.remove("shown");

    stopRecordingFn = ruStartRecording({
      onStart: () => {
        isRecording = true;
        micBtn.classList.add("listening");
        hint.textContent = "بيسجل الآن... دوس تاني عشان توقف";
      },
      onStop: (url) => {
        isRecording = false;
        micBtn.classList.remove("listening");
        hint.textContent = "دوس وقول الكلمة، ودوس تاني عشان توقف التسجيل";
        lastRecordingUrl = url;
        document.getElementById("resultBox").classList.add("shown");
      },
      onError: (msg) => {
        isRecording = false;
        micBtn.classList.remove("listening");
        const eb = document.getElementById("errorBox");
        eb.textContent = msg;
        eb.classList.add("shown");
      }
    });
  } else {
    // وقف التسجيل الحالي
    if (stopRecordingFn) stopRecordingFn();
  }
}

function rate(verdict){
  attempts++;
  const scoreMap = { excellent: 95, close: 70, retry: 35 };
  scoreSum += scoreMap[verdict];
  document.getElementById("attemptsNum").textContent = attempts;
  document.getElementById("avgNum").textContent = Math.round(scoreSum/attempts) + "%";

  const verdictMap = {
    excellent: "🎉 ممتاز! نطق قريب جداً",
    close:     "👍 قريب، بس فيه مجال تحسّن",
    retry:     "🔁 جرب تاني، ركّز على كل حرف"
  };
  const verdictEl = document.getElementById("verdictText");
  verdictEl.textContent = verdictMap[verdict];
  verdictEl.className = "verdict shown " + verdict;

  if (verdict === "excellent") RuProgress.addXp(8, "pronunciation_excellent");
  else if (verdict === "close") RuProgress.addXp(4, "pronunciation_close");
  ruRenderStatsBar("statsBar");
}

loadPool();
nextWord();
</script>
</body>
</html>
